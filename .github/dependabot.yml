# Keeps the SHA-pinned actions in .github/workflows (#62) current (#65).
# Dependabot bumps the commit SHA and its trailing `# vX.Y.Z` comment together.
# #161: also the digest-pinned Dockerfile FROM lines, the pip-compile lock
# (apps/api/requirements.in -> requirements.txt) and the npm workspace lockfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/frontend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
    # CI's Python (3.12) and .nvmrc/engines (24) must move together with the
    # images, so those bumps are manual. Digest and nginx bumps stay automatic.
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only minor/patch bumps are grouped. Each major bump gets its own PR so a
    # breaking change can't hold every other update hostage (see #181).
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # typescript-eslint doesn't support TypeScript 7 yet; lift this once it does.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
