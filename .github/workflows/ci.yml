name: CI

# check        -> every push and PR (tests, lint, typecheck, real-HTTP journeys, PostgreSQL smoke, benchmark)
# publish      -> merge to main: build once, push <sha>/<short-sha>, move `latest`
#                 v* tag: re-tag the SAME <sha> image with the release name (build only if missing)
# deploy-development -> merge to main, still head of main: Railway development (`development` environment)
# deploy-production -> v* tag: promote-production.yml (production approval) with that SHA
# Docs-only changes skip everything. Path filters are ignored for tag pushes, so tags always run.
on:
  push:
    paths-ignore: ['_docs/**', '**/*.md', '.claude/**']
  pull_request:
    paths-ignore: ['_docs/**', '**/*.md', '.claude/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: call_center_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d call_center_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Railway image refs pinned to :latest
        run: |
          .github/workflows/test-railway-image-latest.sh --self-test
          .github/workflows/test-railway-image-latest.sh
      - run: npm ci
      - run: npm run contract:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Backend auth checks
        run: |
          python -m pip install --require-hashes -r apps/api/requirements.txt
          python -m pip install -r apps/api/requirements-dev.txt
          python -m compileall -q apps/api
          python -m pytest apps/api/test/test_auth.py apps/api/test/test_auth_adapters.py --tb=no
          DATABASE_URL=sqlite+pysqlite:////tmp/call-center-ci.db alembic -c apps/api/alembic.ini upgrade head
      - name: Observability checks
        # grafanalib is a generator-only tool (see observability/_gen_grafana_dashboard.py),
        # not an apps/api runtime dependency, so it's installed just for this step.
        run: |
          python -m pip install grafanalib
          python -m pytest observability --tb=no
          python3 -m observability._gen_grafana_dashboard > observability/grafana-dashboard.json
          git diff --exit-code observability/grafana-dashboard.json
      - name: Real-HTTP journeys
        run: npm run test:journey
      - name: PostgreSQL authentication acceptance
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/call_center_ci
        run: python -m pytest apps/api/test/test_auth_adapters.py --tb=no
      - name: PostgreSQL migration and HTTP smoke
        env:
          CALL_CENTER_STORAGE: postgres
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/call_center_ci
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          python -m apps.api.postgres_smoke
      - name: PostgreSQL benchmark smoke
        # CI runs the small `ci` scale (hundreds of rows, not the 10k/150k full scale) purely to
        # prove benchmark.py's seed/HTTP/EXPLAIN pipeline executes against real PostgreSQL; it is
        # not evidence of the 1s/p95 target at full scale -- see _docs/persistence.md for that.
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/call_center_ci
          BENCHMARK_SCALE: ci
        run: python -m apps.api.benchmark

  publish:
    name: Build and publish images
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_api: ${{ steps.names.outputs.image_api }}
      image_frontend: ${{ steps.names.outputs.image_frontend }}
      is_main_head: ${{ steps.head.outputs.is_main_head }}
    # Serialize runs per ref so `latest` can't move out of order.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image names
        id: names
        env:
          OWNER_REPO: ${{ github.repository }}
        run: |
          OWNER_REPO_LOWER="${OWNER_REPO,,}"
          OWNER="${OWNER_REPO_LOWER%%/*}"
          REPO="${OWNER_REPO_LOWER##*/}"
          echo "IMAGE_API=ghcr.io/${OWNER}/${REPO}-api" >> "$GITHUB_ENV"
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER}/${REPO}-frontend" >> "$GITHUB_ENV"
          echo "image_api=ghcr.io/${OWNER}/${REPO}-api" >> "$GITHUB_OUTPUT"
          echo "image_frontend=ghcr.io/${OWNER}/${REPO}-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once per commit: a <sha> image is never rebuilt (reruns, or a v* tag on a commit main
      # already published), so every environment runs the exact same image digest.
      - name: Check for an existing image for this commit
        run: |
          if docker manifest inspect "$IMAGE_API:$GITHUB_SHA" > /dev/null 2>&1 && docker manifest inspect "$IMAGE_FRONTEND:$GITHUB_SHA" > /dev/null 2>&1; then
            echo "IMAGE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "IMAGE_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Build and push <sha> images
        if: env.IMAGE_EXISTS == 'false'
        run: |
          docker build -f apps/api/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE_API:$GITHUB_SHA" .
          docker build -f apps/frontend/Dockerfile -t "$IMAGE_FRONTEND:$GITHUB_SHA" .
          docker push "$IMAGE_API:$GITHUB_SHA"
          docker push "$IMAGE_FRONTEND:$GITHUB_SHA"

      # A rerun of an old main run must not move `latest` or redeploy development to that old commit.
      - name: Check this commit is still the head of main
        id: head
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$MAIN_HEAD" = "$GITHUB_SHA" ]; then
            echo "IS_MAIN_HEAD=true" >> "$GITHUB_ENV"
            echo "is_main_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_MAIN_HEAD=false" >> "$GITHUB_ENV"
            echo "::warning::$GITHUB_SHA is no longer the head of main ($MAIN_HEAD); not moving latest or deploying development. Roll back explicitly instead (see _docs/deployment.md)."
          fi

      # Extra tags point at the same digest (registry-side copy, no rebuild): short SHA always,
      # plus `latest` for the current main head or the release name for a v* tag.
      - name: Add image tags
        run: |
          TAGS="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAGS="$TAGS $GITHUB_REF_NAME"; elif [ "$IS_MAIN_HEAD" = true ]; then TAGS="$TAGS latest"; fi
          for t in $TAGS; do
            docker buildx imagetools create -t "$IMAGE_API:$t" "$IMAGE_API:$GITHUB_SHA"
            docker buildx imagetools create -t "$IMAGE_FRONTEND:$t" "$IMAGE_FRONTEND:$GITHUB_SHA"
          done

  # #27: unattended auto-deploy of Railway's `development` environment on every new main head.
  # The Railway CLI pins an image-sourced service to one fixed image reference and does not
  # auto-redeploy on a new registry tag, so this job is the trigger, re-pointing each service
  # at the commit's own <sha> image.
  #
  # #162: its own job so only it uses the `development` GitHub environment (deployment branches:
  # `main` only), and RAILWAY_API_TOKEN resolves to that environment's secret. `publish` also runs
  # for v* tags, which that policy would reject. Runs only for a push to main whose commit was still
  # the head of main in `publish`; skipped for tags, PRs, other branches and re-runs of old commits.
  #
  # RAILWAY_API_TOKEN, not RAILWAY_TOKEN: a Project Token is environment-scoped and read-mostly
  # and cannot run `service source connect` ("Unauthorized"). Only an account/workspace token can.
  # It has no implicit project context in CI, so --project is passed explicitly.
  deploy-development:
    name: Deploy development (Railway)
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.outputs.is_main_head == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    # One dev deploy at a time; the head re-check below drops one that main has moved past meanwhile.
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    steps:
      - name: Check this commit is still the head of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$MAIN_HEAD" = "$GITHUB_SHA" ]; then
            echo "IS_MAIN_HEAD=true" >> "$GITHUB_ENV"
          else
            echo "IS_MAIN_HEAD=false" >> "$GITHUB_ENV"
            echo "::warning::$GITHUB_SHA is no longer the head of main ($MAIN_HEAD); not deploying development."
          fi

      - name: Deploy development (Railway)
        if: env.IS_MAIN_HEAD == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: e7501ba0-4b15-42e1-a4a5-e4a4aaba614b
          IMAGE_API: ${{ needs.publish.outputs.image_api }}
          IMAGE_FRONTEND: ${{ needs.publish.outputs.image_frontend }}
        run: |
          npm install -g @railway/cli@5.57.5
          railway service source connect --image "$IMAGE_API:$GITHUB_SHA" --service api --environment development --project "$RAILWAY_PROJECT_ID"
          railway service source connect --image "$IMAGE_FRONTEND:$GITHUB_SHA" --service frontend --environment development --project "$RAILWAY_PROJECT_ID"

  # Release tag -> production: same human-approved promotion workflow (`production` environment)
  # as a manual promotion or rollback, pinned to this commit's <sha> image.
  deploy-production:
    name: Deploy production
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/promote-production.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
