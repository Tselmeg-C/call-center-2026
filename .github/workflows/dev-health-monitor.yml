name: Development health monitor

# #27: "a named, actually-configured monitoring tool ... checks /health/ready
# at least every 5 minutes". Railway's own product has deploy-time
# healthchecks (used for zero-downtime cutover, see .railway/railway.ts) but
# no continuous external uptime check, and no Grafana Cloud account exists
# yet (#44) -- so this workflow is the named monitor: a GitHub Actions cron
# hitting the deployed API's /health/ready every 5 minutes. A failing run
# shows red in this repo's Actions tab (the dashboard) and GitHub notifies
# the repo's watchers by default (the notification channel) -- both are real
# and inspectable without any new external account.
#
# DEV_API_HEALTH_URL (a GitHub Actions repository *variable*, not a secret --
# it's a public HTTPS URL) must be set to the api service's Railway domain,
# e.g. https://api-development-xxxx.up.railway.app, once that domain exists.
# Until then this workflow's steps no-op with a clear message instead of
# failing every 5 minutes for a reason unrelated to the API's own health.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check /health/ready
        env:
          URL: ${{ vars.DEV_API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::DEV_API_HEALTH_URL repository variable is not set yet -- see this file's header comment. Skipping."
            exit 0
          fi
          status=$(curl -fsS -o /tmp/health.json -w '%{http_code}' "$URL/health/ready") || status="$?"
          echo "HTTP status: $status"
          cat /tmp/health.json 2>/dev/null || true
          if [ "$status" != "200" ]; then
            echo "::error::/health/ready did not return 200 (got $status)"
            exit 1
          fi
