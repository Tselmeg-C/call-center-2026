name: Frontend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: call_center_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d call_center_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run contract:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Backend auth checks
        run: |
          python -m pip install -r apps/api/requirements.txt
          python -m compileall -q apps/api
          python -m pytest apps/api/test_auth.py apps/api/test_auth_adapters.py --tb=no
          DATABASE_URL=sqlite+pysqlite:////tmp/call-center-ci.db alembic -c apps/api/alembic.ini upgrade head
      - name: PostgreSQL authentication acceptance
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/call_center_ci
        run: python -m pytest apps/api/test_auth_adapters.py --tb=no
      - name: PostgreSQL migration and HTTP smoke
        env:
          CALL_CENTER_STORAGE: postgres
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/call_center_ci
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          python -m apps.api.postgres_smoke
      - name: PostgreSQL benchmark smoke
        # CI runs the small `ci` scale (hundreds of rows, not the 10k/150k full scale) purely to
        # prove benchmark.py's seed/HTTP/EXPLAIN pipeline executes against real PostgreSQL; it is
        # not evidence of the 1s/p95 target at full scale -- see _docs/persistence.md for that.
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/call_center_ci
          BENCHMARK_SCALE: ci
        run: python -m apps.api.benchmark

  publish:
    name: Build and publish images
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialize only main-push runs (so `latest` can't land out of order); PR/other-branch
    # runs each get their own group and never queue behind main or each other.
    concurrency:
      group: publish-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercased image names
        env:
          OWNER_REPO: ${{ github.repository }}
        run: |
          OWNER_REPO_LOWER="${OWNER_REPO,,}"
          OWNER="${OWNER_REPO_LOWER%%/*}"
          REPO="${OWNER_REPO_LOWER##*/}"
          echo "IMAGE_API=ghcr.io/${OWNER}/${REPO}-api" >> "$GITHUB_ENV"
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER}/${REPO}-frontend" >> "$GITHUB_ENV"

      - name: Build API image
        run: docker build -f apps/api/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE_API:$GITHUB_SHA" -t "$IMAGE_API:latest" .

      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile -t "$IMAGE_FRONTEND:$GITHUB_SHA" -t "$IMAGE_FRONTEND:latest" .

      # Everything below only runs for a push to main -- PRs (including from forks) and
      # other branches stop at the build steps above, never push an image.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_API:$GITHUB_SHA"
          docker push "$IMAGE_API:latest"

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_FRONTEND:$GITHUB_SHA"
          docker push "$IMAGE_FRONTEND:latest"

      # #27: unattended auto-deploy of Railway's `development` environment on every successful
      # main build. The installed Railway CLI pins an image-sourced service to one fixed image
      # reference and does not auto-redeploy on a new registry tag the way a GitHub-repo source
      # does (confirmed against `railway service source --help` while grooming #27) -- so this
      # step is the trigger, re-pointing each service at the commit's own image tag. Only
      # production promotion (#33's gated workflow_dispatch) requires human approval.
      #
      # RAILWAY_API_TOKEN, not RAILWAY_TOKEN: a Project Token (what RAILWAY_TOKEN expects) is
      # environment-scoped and read-mostly -- it can query but cannot perform mutations like
      # `service source connect` (fails with "Unauthorized", confirmed against a real CI run).
      # Only an account-scoped token (railway.com/account/tokens), set as RAILWAY_API_TOKEN, can
      # actually change a service's deployed image. This does mean the token has access beyond
      # just this one project -- Railway's CLI has no narrower mutation-capable scope today.
      - name: Deploy development (Railway)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          npm install -g @railway/cli@5
          railway service source connect --image "$IMAGE_API:$GITHUB_SHA" --service api --environment development
          railway service source connect --image "$IMAGE_FRONTEND:$GITHUB_SHA" --service frontend --environment development
