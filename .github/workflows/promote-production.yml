name: Promote to production

# Run by hand, or called by ci.yml after a `v*` release tag publishes images. Takes an
# already-published GHCR image tag (a commit SHA or "latest") and points Railway production at
# it -- never builds anything. The `production` environment's protection rules gate both paths.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote (commit SHA or "latest")'
        required: true
        type: string
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Verify and promote
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: Compute lowercased image names
        env:
          OWNER_REPO: ${{ github.repository }}
        run: |
          OWNER_REPO_LOWER="${OWNER_REPO,,}"
          OWNER="${OWNER_REPO_LOWER%%/*}"
          REPO="${OWNER_REPO_LOWER##*/}"
          echo "IMAGE_API=ghcr.io/${OWNER}/${REPO}-api" >> "$GITHUB_ENV"
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER}/${REPO}-frontend" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag exists for both images
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -e
          echo "Verifying $IMAGE_API:$TAG exists in GHCR..."
          docker manifest inspect "$IMAGE_API:$TAG" > /dev/null
          echo "Verifying $IMAGE_FRONTEND:$TAG exists in GHCR..."
          docker manifest inspect "$IMAGE_FRONTEND:$TAG" > /dev/null
          echo "Both images verified for tag $TAG."

      # Same account-scoped token and pattern as ci.yml's "Deploy development" step: a Project
      # Token is environment-scoped and read-mostly and cannot run `service source connect`
      # ("Unauthorized"). RAILWAY_API_TOKEN already exists and works for every environment in
      # this account, so production reuses it rather than needing a separate secret.
      - name: Point Railway production service at verified tag
        env:
          TAG: ${{ inputs.image_tag }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: e7501ba0-4b15-42e1-a4a5-e4a4aaba614b
        run: |
          set -e
          npm install -g @railway/cli@5.57.5
          railway service source connect --image "$IMAGE_API:$TAG" --service api-prod --environment production --project "$RAILWAY_PROJECT_ID"
          railway service source connect --image "$IMAGE_FRONTEND:$TAG" --service frontend-prod --environment production --project "$RAILWAY_PROJECT_ID"
