services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: call_center_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "call_center_test"]
      interval: 2s
      timeout: 5s
      retries: 20
