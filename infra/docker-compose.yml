services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: call_center
      POSTGRES_USER: call_center
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U call_center -d call_center"]
      interval: 5s
      timeout: 5s
      retries: 10
