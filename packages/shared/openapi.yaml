openapi: 3.1.0
info:
  title: Call Center Sales API
  version: 0.1.0
  description: Sales/session contract derived from the in-memory service adapter.
servers:
  - url: https://example.invalid
security:
  - sessionCookie: []
paths:
  /session/login:
    post:
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' }, example: { email: river@example.test, password: synthetic-only } } }
      responses: { '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '422': { $ref: '#/components/responses/Validation' } }
  /session/logout:
    post:
      operationId: logout
      responses: { '204': { description: Signed out }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /session/me:
    get:
      operationId: currentUser
      responses: { '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /customers:
    get:
      operationId: listCustomers
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { name: status, in: query, schema: { type: string, enum: [Open, Closed] } } ]
      responses: { '200': { description: Customers, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /customers/{bcn}:
    parameters: [ { $ref: '#/components/parameters/Bcn' } ]
    get:
      operationId: getCustomer
      responses: { '200': { description: Customer detail, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerDetail' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '404': { $ref: '#/components/responses/NotFound' } }
  /customers/{bcn}/interactions:
    post:
      operationId: createInteraction
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InteractionRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/History' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } }
  /customers/{bcn}/notes:
    post:
      operationId: createNote
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/History' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } }
  /customers/{bcn}/history/{id}:
    delete:
      operationId: deleteHistory
      parameters: [ { $ref: '#/components/parameters/Bcn' }, { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Tombstone, content: { application/json: { schema: { $ref: '#/components/schemas/History' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /workload:
    get:
      operationId: workload
      responses: { '200': { description: Workload, content: { application/json: { schema: { $ref: '#/components/schemas/Workload' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /customers/{bcn}/follow-ups:
    post:
      operationId: createFollowUp
      parameters: [ { $ref: '#/components/parameters/Bcn' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUp' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } }
  /customers/{bcn}/follow-ups/{followUpId}:
    patch:
      operationId: updateFollowUp
      parameters: [ { $ref: '#/components/parameters/Bcn' }, { name: followUpId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpRequest' } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUp' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } }
    delete:
      operationId: cancelFollowUp
      parameters: [ { $ref: '#/components/parameters/Bcn' }, { name: followUpId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUp' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /customers/{bcn}/follow-ups/{followUpId}/complete:
    post:
      operationId: completeFollowUp
      parameters: [ { $ref: '#/components/parameters/Bcn' }, { name: followUpId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionRequest' } } } }
      responses: { '200': { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUp' } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } }
  /customers/{bcn}/close:
    post:
      operationId: closeCustomer
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LifecycleRequest' } } } }
      responses: { '200': { description: Closed }, '401': { $ref: '#/components/responses/Unauthenticated' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } }
  /customers/{bcn}/reopen:
    post:
      operationId: reopenCustomer
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/MutationMeta' } } } }
      responses: { '200': { description: Reopened }, '401': { $ref: '#/components/responses/Unauthenticated' }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/users:
    get:
      operationId: listUsers
      responses: { '200': { description: Users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } }
  /admin/closure-reasons:
    get: { operationId: listClosureReasons, responses: { '200': { description: Reasons, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClosureReason' } } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { operationId: createClosureReason, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LabelRequest' } } } }, responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } } }
  /admin/closure-reasons/{id}:
    patch: { operationId: updateClosureReason, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonUpdate' } } } }, responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } } }
  /admin/imports:
    post: { operationId: importWorkbook, requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/WorkbookUpload' } } } }, responses: { '200': { description: Job result, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { description: Too large }, '415': { description: Unsupported format }, '422': { $ref: '#/components/responses/Validation' } } }
  /admin/assignments:
    get: { operationId: listAssignmentRules, responses: { '200': { description: Rules, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssignmentRule' } } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { operationId: createAssignmentRule, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentRuleRequest' } } } }, responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } } }
  /admin/assignments/run:
    post: { operationId: runAssignments, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentRunRequest' } } } }, responses: { '200': { description: Run result, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentRunResult' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Validation' } } }
  /admin/reports:
    get: { operationId: reports, parameters: [{ name: start, in: query, schema: { type: string, format: date } }, { name: end, in: query, schema: { type: string, format: date } }], responses: { '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/ReportData' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
  /admin/audit:
    get: { operationId: audit, parameters: [{ name: actor, in: query, schema: { type: string } }, { name: action, in: query, schema: { type: string } }, { name: bcn, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { description: Audit events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: call_center_session, description: Opaque HttpOnly SameSite=Lax cookie; Secure outside localhost; absolute eight-hour expiry. }
  parameters:
    Bcn: { name: bcn, in: path, required: true, schema: { type: string, pattern: '^[0-9]{6,}$' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    Unauthenticated: { description: Unauthenticated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Validation: { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    User: { type: object, required: [id, name, role], properties: { id: { type: string }, name: { type: string }, email: { type: string, format: email }, role: { type: string, enum: [Admin, Sales] }, active: { type: boolean } }, additionalProperties: false }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, writeOnly: true } }, additionalProperties: false }
    MutationMeta: { type: object, required: [submissionId], properties: { submissionId: { type: string, minLength: 1 }, expectedVersion: { type: string } }, additionalProperties: false }
    Customer: { type: object, required: [bcn, name, status], properties: { bcn: { type: string }, name: { type: string }, ownerId: { type: [string, 'null'] }, ownerName: { type: [string, 'null'] }, status: { type: string, enum: [Open, Closed] }, phones: { type: array, items: { type: string } }, source: { type: object, additionalProperties: true }, version: { type: integer }, histories: { type: array, items: { $ref: '#/components/schemas/History' } }, followUps: { type: array, items: { $ref: '#/components/schemas/FollowUp' } } }, additionalProperties: false }
    CustomerDetail: { allOf: [{ $ref: '#/components/schemas/Customer' }, { type: object, properties: { histories: { type: array, items: { $ref: '#/components/schemas/History' } } } }] }
    CustomerPage: { type: object, required: [items, page, page_size, total], properties: { items: { type: array, items: { $ref: '#/components/schemas/Customer' } }, page: { type: integer }, page_size: { type: integer }, total: { type: integer } }, additionalProperties: false }
    # Loosely typed on purpose: a discriminated bag keyed by `kind` (Interaction, Standalone
    # note, Follow-up, Closure, Reopen, Assignment, ...), each carrying only the fields that
    # kind needs (e.g. Assignment carries oldOwner/newOwner instead of text).
    History: { type: object, required: [kind], properties: { id: { type: string }, kind: { type: string }, actor: { type: string }, actorId: { type: string }, timestamp: { type: string, format: date-time }, text: { type: [string, 'null'] }, outcome: { type: [string, 'null'] }, deleted: { type: boolean }, deletedBy: { type: string }, deletedAt: { type: string, format: date-time }, reasonId: { type: string }, reason: { type: string }, oldOwner: { type: [string, 'null'] }, newOwner: { type: [string, 'null'] } }, additionalProperties: true }
    InteractionRequest: { allOf: [{ $ref: '#/components/schemas/MutationMeta' }, { type: object, required: [outcome], properties: { outcome: { type: string, enum: [Attempt, Contact] }, note: { type: [string, 'null'], maxLength: 4000 } }, additionalProperties: false }] }
    NoteRequest: { allOf: [{ $ref: '#/components/schemas/MutationMeta' }, { type: object, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 4000 } }, additionalProperties: false }] }
    LifecycleRequest: { allOf: [{ $ref: '#/components/schemas/MutationMeta' }, { type: object, required: [reasonId], properties: { reasonId: { type: string } }, additionalProperties: false }] }
    FollowUpRequest: { allOf: [{ $ref: '#/components/schemas/MutationMeta' }, { type: object, required: [type], properties: { type: { type: string, enum: [Appointment, Reminder, 'Follow-up needed'] }, due: { type: [string, 'null'], format: date-time }, dueKind: { type: string, enum: [date, datetime, none] }, note: { type: [string, 'null'], maxLength: 4000 }, expectedUpdatedAt: { type: [string, 'null'], format: date-time } }, additionalProperties: false }] }
    CompletionRequest: { allOf: [{ $ref: '#/components/schemas/MutationMeta' }, { type: object, required: [outcome], properties: { outcome: { type: string, enum: [Attempt, Contact] }, note: { type: [string, 'null'], maxLength: 4000 } }, additionalProperties: false }] }
    FollowUp: { type: object, required: [id, bcn, type, status, createdAt, updatedAt], properties: { id: { type: string }, bcn: { type: string }, type: { type: string, enum: [Appointment, Reminder, 'Follow-up needed'] }, due: { type: [string, 'null'] }, dueKind: { type: string, enum: [date, datetime, none] }, note: { type: [string, 'null'] }, status: { type: string, enum: [Open, Completed, Cancelled] }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }, additionalProperties: false }
    AdminUserRequest: { type: object, required: [name, email, role], properties: { name: { type: string, minLength: 1, maxLength: 120 }, email: { type: string, format: email, maxLength: 254 }, role: { type: string, enum: [Admin, Sales] }, initialPassword: { type: string, writeOnly: true } }, additionalProperties: false }
    UserUpdate: { type: object, properties: { name: { type: string }, role: { type: string, enum: [Admin, Sales] }, active: { type: boolean } }, additionalProperties: false }
    ClosureReason: { type: object, required: [id, label, active], properties: { id: { type: string }, label: { type: string }, active: { type: boolean } }, additionalProperties: false }
    LabelRequest: { type: object, required: [label], properties: { label: { type: string, minLength: 1, maxLength: 120 } }, additionalProperties: false }
    ReasonUpdate: { type: object, properties: { label: { type: string }, active: { type: boolean } }, additionalProperties: false }
    WorkbookUpload: { type: object, required: [file, submissionId], properties: { file: { type: string, format: binary }, submissionId: { type: string } }, additionalProperties: false }
    ImportResult: { type: object, required: [jobId, filename, status, processed, created, updated, errorRows], properties: { jobId: { type: string }, filename: { type: string }, status: { type: string, enum: [Completed, Partial, Rejected] }, processed: { type: integer }, created: { type: integer }, updated: { type: integer }, errorRows: { type: integer }, errors: { type: array, items: { type: object, required: [row, field, reason], properties: { row: { type: integer }, field: { type: string }, reason: { type: string } } } } }, additionalProperties: false }
    AssignmentRule: { type: object, required: [id, name, active, position, field, operator, value, eligibleSalesIds], properties: { id: { type: string }, name: { type: string }, active: { type: boolean }, position: { type: integer }, field: { type: string }, operator: { type: string }, value: { type: string }, eligibleSalesIds: { type: array, items: { type: string } } }, additionalProperties: false }
    AssignmentRuleRequest: { allOf: [{ $ref: '#/components/schemas/MutationMeta' }, { $ref: '#/components/schemas/AssignmentRule' }] }
    AssignmentRunRequest: { allOf: [{ $ref: '#/components/schemas/MutationMeta' }, { type: object, required: [scope], properties: { scope: { type: string, enum: [unassigned, all, selected] }, selectedBcns: { type: array, items: { type: string } }, expectedVersion: { type: integer } } }] }
    AssignmentRunResult: { type: object, required: [scanned, assigned, reassigned, unchanged, skipped, results], properties: { scanned: { type: integer }, assigned: { type: integer }, reassigned: { type: integer }, unchanged: { type: integer }, skipped: { type: integer }, results: { type: array, items: { type: object } } }, additionalProperties: false }
    ReportData: { type: object, required: [owners, daily, closureReasons, followUps], properties: { owners: { type: array, items: { type: object } }, daily: { type: array, items: { type: object } }, closureReasons: { type: array, items: { type: object } }, followUps: { type: object } }, additionalProperties: false }
    AuditEvent: { type: object, required: [id, actor, actorId, action, target, timestamp, details], properties: { id: { type: string }, actor: { type: string }, actorId: { type: string }, action: { type: string }, target: { type: string }, timestamp: { type: string, format: date-time }, details: { type: object, additionalProperties: true } }, additionalProperties: false }
    Workload: { type: object, required: [asOf, today, counts, customers], properties: { asOf: { type: string, format: date-time }, today: { type: string, format: date }, counts: { type: object, additionalProperties: { type: integer } }, customers: { type: array, items: { $ref: '#/components/schemas/Customer' } } }, additionalProperties: false }
    Error: { type: object, required: [code, message, requestId], properties: { code: { type: string }, message: { type: string }, requestId: { type: string }, fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } } }, additionalProperties: false }
